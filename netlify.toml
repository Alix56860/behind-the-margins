[build]
  publish = "."
  command = "echo 'static site, no build step'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
